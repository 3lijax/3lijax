<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 375" width="100%" height="375">
  <defs>
    <linearGradient id="linuxTerminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="40%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <linearGradient id="linuxHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="50%" stop-color="#162033" />
      <stop offset="100%" stop-color="#0f1624" />
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#00ff88;#00f0ff" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bd00ff">
        <animate attributeName="stop-color" values="#bd00ff;#00f0ff;#7928ca;#bd00ff" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff66">
        <animate attributeName="stop-color" values="#00ff66;#bd00ff;#00f0ff;#00ff66" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f0ff" stroke-width="0.35" opacity="0.07" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes radarPulse {
      0% { r: 3.5; opacity: 0.9; }
      50% { r: 6.5; opacity: 0.2; }
      100% { r: 3.5; opacity: 0.9; }
    }
    .fira { font-family: 'Fira Code', 'JetBrains Mono', 'Source Code Pro', Consolas, monospace; }
    .term-header-text { font-family: 'Fira Code', monospace; font-size: 12.5px; fill: #7dcfff; font-weight: 600; letter-spacing: 0.3px; }
    .key-bracket { fill: #00f0ff; font-weight: 700; font-family: 'Fira Code', monospace; font-size: 13px; }
    .key-name { fill: #bb9af7; font-weight: 700; font-size: 12px; font-family: 'Fira Code', monospace; }
    .val-main { fill: #f0f6fc; font-weight: 600; font-size: 13px; font-family: 'Segoe UI', Ubuntu, sans-serif; }
    .val-sub { fill: #7982a9; font-size: 11.5px; font-family: 'Segoe UI', Ubuntu, sans-serif; }
    .cursor-box { animation: blink 1.1s infinite; fill: #00f0ff; }
    .beacon { animation: radarPulse 2s infinite ease-out; fill: #00ff88; }
  </style>

  <rect x="2" y="2" width="836" height="371" rx="8" fill="url(#linuxTerminalBg)" stroke="url(#cyberBorder)" stroke-width="1.8" />
  <rect x="2" y="2" width="836" height="371" rx="8" fill="url(#scanlines)" pointer-events="none" />

  <path d="M 2 8 Q 2 2 8 2 L 832 2 Q 838 2 838 8 L 838 38 L 2 38 Z" fill="url(#linuxHeader)" />
  <line x1="2" y1="38" x2="838" y2="38" stroke="#1d283d" stroke-width="1.2" />

  <g transform="translate(18, 24)">
    <rect x="0" y="-11" width="18" height="15" rx="3" fill="#0d1424" stroke="#00f0ff" stroke-width="1" />
    <text x="4" y="0.5" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#00f0ff">&gt;_</text>
    <text x="26" y="0.5" class="term-header-text">3lijax@cyber-station:~ [zsh / Kali / Hyprland]</text>
  </g>

  <g transform="translate(760, 20)">
    <rect x="0" y="-8" width="18" height="16" rx="2" fill="#131b2c" stroke="#253550" stroke-width="1" />
    <line x1="5" y1="3" x2="13" y2="3" stroke="#7aa2f7" stroke-width="1.8" stroke-linecap="round" />

    <rect x="24" y="-8" width="18" height="16" rx="2" fill="#131b2c" stroke="#253550" stroke-width="1" />
    <rect x="28" y="-4" width="10" height="8" fill="none" stroke="#7aa2f7" stroke-width="1.4" />

    <rect x="48" y="-8" width="18" height="16" rx="2" fill="#2d1522" stroke="#f7768e" stroke-width="1" />
    <line x1="52.5" y1="-3.5" x2="61.5" y2="5.5" stroke="#f7768e" stroke-width="1.6" />
    <line x1="61.5" y1="-3.5" x2="52.5" y2="5.5" stroke="#f7768e" stroke-width="1.6" />
  </g>

  <g transform="translate(24, 68)" class="fira">
    <text x="0" y="0" font-size="12.5">
      <tspan fill="#00f0ff">[kali@cyber-station]</tspan><tspan fill="#565f89"> - </tspan><tspan fill="#ff9e64">[~]</tspan>
    </text>
    <text x="0" y="20" font-size="12.5">
      <tspan fill="#00f0ff">$ </tspan><tspan fill="#ff9e64" font-weight="700">sysfetch</tspan> <tspan fill="#2ac3de">--profile</tspan> <tspan fill="#7dcfff">--futuristic</tspan>
    </text>
    <rect x="270" y="8" width="8" height="15" class="cursor-box" />
  </g>

  <g transform="translate(24, 115)">
    <polygon points="0,15 15,0 175,0 190,15 190,185 175,200 15,200 0,185" fill="#080e1a" stroke="#00f0ff" stroke-width="1.2" opacity="0.9" />
    
    <path d="M 4 22 L 4 6 L 20 6" fill="none" stroke="#bd00ff" stroke-width="1.8" />
    <path d="M 186 22 L 186 6 L 170 6" fill="none" stroke="#bd00ff" stroke-width="1.8" />
    <path d="M 4 178 L 4 194 L 20 194" fill="none" stroke="#bd00ff" stroke-width="1.8" />
    <path d="M 186 178 L 186 194 L 170 194" fill="none" stroke="#bd00ff" stroke-width="1.8" />

    <g transform="translate(95, 62)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#1d3050" stroke-width="1" stroke-dasharray="4, 4" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5" />
      
      <path d="M 0 -28 C -14 -28 -20 -16 -20 6 C -20 18 -26 28 -18 30 C -12 32 -10 26 0 26 C 10 26 12 32 18 30 C 26 28 20 18 20 6 C 20 -16 14 -28 0 -28 Z" fill="#0c1424" stroke="#00f0ff" stroke-width="1.6" filter="url(#neonGlow)" />
      
      <path d="M 0 -12 C -8 -12 -12 -2 -12 10 C -12 20 -6 24 0 24 C 6 24 12 20 12 10 C 12 -2 8 -12 0 -12 Z" fill="#142138" stroke="#7aa2f7" stroke-width="1" />
      
      <path d="M -9 -14 L 9 -14 L 7 -9 L -7 -9 Z" fill="#00ff88" filter="url(#neonGlow)" />
      
      <polygon points="0,-7 5,-3 0,1 -5,-3" fill="#ff9e64" stroke="#ff9e64" stroke-width="0.8" />
      
      <line x1="-20" y1="4" x2="-28" y2="16" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="-28" cy="16" r="2.5" fill="#00f0ff" />
      <line x1="20" y1="4" x2="28" y2="16" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="28" cy="16" r="2.5" fill="#00f0ff" />
    </g>

    <rect x="25" y="118" width="140" height="24" rx="4" fill="#10192e" stroke="#00f0ff" stroke-width="1" />
    <text x="95" y="134" text-anchor="middle" class="fira" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="1px">3LIJAX // CORE</text>

    <text x="95" y="157" text-anchor="middle" class="fira" font-size="10" fill="#7dcfff">KERNEL: 6.10-KALI</text>
    <text x="95" y="172" text-anchor="middle" class="fira" font-size="10" fill="#bb9af7">ENV: SECURE-PORTABLE</text>
    <text x="95" y="187" text-anchor="middle" class="fira" font-size="10" fill="#00ff88" font-weight="700">[HARDENED NODE]</text>
  </g>

  <g transform="translate(230, 115)">
    <line x1="0" y1="0" x2="0" y2="200" stroke="#1c2d4a" stroke-width="1.5" stroke-dasharray="4, 3" />
    <circle cx="0" cy="20" r="3" fill="#00f0ff" />
    <circle cx="0" cy="80" r="3" fill="#bd00ff" />
    <circle cx="0" cy="140" r="3" fill="#00ff88" />
  </g>

  <g transform="translate(252, 115)" class="fira">
    
    <g transform="translate(0, 20)">
      <text x="0" y="0" class="key-bracket">&gt;</text>
      <text x="18" y="0" class="key-name">IDENTITY</text>
      <text x="135" y="0" class="val-main">
        <tspan fill="#ffffff" font-weight="700">Elijah</tspan>
        <tspan fill="#565f89"> // </tspan>
        <tspan fill="#00f0ff" font-weight="700">@3lijax</tspan>
        <tspan fill="#565f89" font-size="11"> [UID: 1000]</tspan>
      </text>
    </g>

    <g transform="translate(0, 58)">
      <text x="0" y="0" class="key-bracket">&gt;</text>
      <text x="18" y="0" class="key-name">LOCATION</text>
      <text x="135" y="0" class="val-main">
        <tspan fill="#7dcfff" font-weight="600">Nairobi, Kenya</tspan>
        <tspan fill="#565f89" font-size="12"> [EAT / UTC+3 // 01&#176;17'S, 36&#176;49'E]</tspan>
      </text>
    </g>

    <g transform="translate(0, 96)">
      <text x="0" y="0" class="key-bracket">&gt;</text>
      <text x="18" y="0" class="key-name">DEV FOCUS</text>
      <text x="135" y="0" class="val-main">
        <tspan fill="#e0af68" font-weight="600">Full-Stack Engineering</tspan>
        <tspan fill="#565f89"> | </tspan>
        <tspan fill="#00f0ff" font-weight="600">Real-Time Architecture</tspan>
      </text>
      <text x="135" y="20" class="val-sub">
        <tspan fill="#bb9af7" font-weight="600">Cybersecurity Tooling</tspan>
        <tspan fill="#565f89"> &amp; </tspan>
        <tspan fill="#00ff88" font-weight="600">Machine Learning Systems</tspan>
      </text>
    </g>

    <g transform="translate(0, 150)">
      <text x="0" y="0" class="key-bracket">&gt;</text>
      <text x="18" y="0" class="key-name">OS MATRIX</text>
      <text x="135" y="0" class="val-main">
        <tspan fill="#ff9e64" font-weight="700">Ubuntu</tspan>
        <tspan fill="#565f89"> | </tspan>
        <tspan fill="#00f0ff" font-weight="700">Kali Linux</tspan>
        <tspan fill="#565f89"> | </tspan>
        <tspan fill="#bd00ff" font-weight="700">Tails OS</tspan>
        <tspan fill="#565f89"> | </tspan>
        <tspan fill="#7aa2f7" font-weight="700">Windows 11</tspan>
      </text>
    </g>

    <g transform="translate(0, 188)">
      <text x="0" y="0" class="key-bracket">&gt;</text>
      <text x="18" y="0" class="key-name">PASSION</text>
      <text x="135" y="0" class="val-main">
        <tspan fill="#f7768e" font-weight="700">Deep Stacked Autoencoders</tspan>
        <tspan fill="#565f89"> &amp; </tspan>
        <tspan fill="#2ac3de" font-weight="700">High-Frequency WebSockets</tspan>
      </text>
    </g>

  </g>

  <g transform="translate(2, 344)">
    <rect x="0" y="0" width="836" height="29" fill="#090e1a" stroke="#16233a" stroke-width="1" />
    
    <rect x="0" y="0" width="85" height="29" fill="#00f0ff" />
    <text x="42" y="19" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="800" fill="#05080f">NORMAL</text>

    <rect x="85" y="0" width="130" height="29" fill="#152238" />
    <text x="150" y="19" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#7dcfff">tmux: session-0</text>

    <text x="240" y="19" font-family="'Fira Code', monospace" font-size="11" fill="#7982a9">
      <tspan fill="#00ff88">*</tspan> 3lijax@mainframe <tspan fill="#565f89">|</tspan> ARCH: x86_64 <tspan fill="#565f89">|</tspan> KERNEL: Linux 6.10
    </text>

    <g transform="translate(805, 15)">
      <circle cx="0" cy="0" r="4" fill="#00ff88" />
      <circle cx="0" cy="0" r="3.5" class="beacon" />
    </g>
    <text x="790" y="19" text-anchor="end" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#00ff88">ONLINE</text>
  </g>

</svg>
