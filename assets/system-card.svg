<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#0c101d" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#1c263d" />
    </linearGradient>

    <!-- Border Animated Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2ac3de">
        <animate attributeName="stop-color" values="#2ac3de;#7aa2f7;#bb9af7;#2ac3de" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0% { r: 4; opacity: 0.8; }
      50% { r: 6.5; opacity: 0.3; }
      100% { r: 4; opacity: 0.8; }
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    .term-title { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #7aa2f7; letter-spacing: 0.5px; }
    .term-status { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #41a6b5; }
    .cmd-text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13.5px; fill: #73daca; font-weight: 600; }
    .cursor { animation: blink 1s infinite; fill: #7aa2f7; }
    .key-label { font-family: 'Fira Code', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #bb9af7; }
    .val-text { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; font-size: 13px; fill: #c0caf5; font-weight: 500; }
    .highlight-val { fill: #e0af68; font-weight: 600; font-family: 'Fira Code', Consolas, monospace; }
    .os-badge { fill: #7dcfff; font-weight: 600; }
    .pulse-circle { animation: pulse 2s infinite ease-in-out; fill: #9ece6a; }
  </style>

  <!-- Card Outer Frame with Neon Gradient Border -->
  <rect x="2" y="2" width="796" height="336" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Terminal Top Window Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 784 2 Q 798 2 798 16 L 798 42 L 2 42 Z" fill="url(#headerGrad)" />
  <line x1="2" y1="42" x2="798" y2="42" stroke="#222f48" stroke-width="1.2" />

  <!-- macOS Style Traffic Lights -->
  <circle cx="22" cy="22" r="6" fill="#ff5f56" />
  <circle cx="42" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="22" r="6" fill="#27c93f" />

  <!-- Window Header Title -->
  <text x="360" y="26" text-anchor="middle" class="term-title">⚡ 3lijax@mainframe:~ (zsh)</text>

  <!-- Live Status Beacon -->
  <g transform="translate(730, 22)">
    <circle cx="0" cy="0" r="4.5" fill="#9ece6a" />
    <circle cx="0" cy="0" r="4" class="pulse-circle" />
    <text x="12" y="3.5" class="term-status">ACTIVE</text>
  </g>

  <!-- Terminal Command Prompt -->
  <g transform="translate(26, 74)">
    <text x="0" y="0" class="cmd-text">
      <tspan fill="#f7768e">guest@3lijax</tspan><tspan fill="#7aa2f7">:</tspan><tspan fill="#e0af68">~</tspan><tspan fill="#c0caf5">$</tspan> <tspan fill="#2ac3de">neofetch</tspan> <tspan fill="#bb9af7">--user</tspan> <tspan fill="#7aa2f7">3lijax</tspan>
    </text>
    <rect x="300" y="-12" width="8" height="15" class="cursor" />
  </g>

  <!-- Content Grid -->
  <!-- Left Side: Stylized Cyber Emblem & ASCII Badge -->
  <g transform="translate(32, 106)">
    <!-- Tech Frame Box -->
    <rect x="0" y="0" width="130" height="200" rx="10" fill="#0d1321" stroke="#253452" stroke-width="1.2" />
    
    <!-- Cyber Emblem Graphic -->
    <g transform="translate(65, 54)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-dasharray="4, 3" opacity="0.6" />
      <polygon points="0,-24 20,-12 20,14 0,26 -20,14 -20,-12" fill="#131d33" stroke="#bb9af7" stroke-width="2" />
      <!-- Lightning Bolt Icon -->
      <path d="M -2 -14 L 6 -14 L 0 -2 L 5 -2 L -5 14 L -2 2 L -7 2 Z" fill="#7dcfff" filter="url(#glow)" />
    </g>

    <!-- Handle Plate -->
    <rect x="15" y="112" width="100" height="26" rx="6" fill="#1b253b" stroke="#7aa2f7" stroke-width="1" />
    <text x="65" y="129" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="700" fill="#7aa2f7">3LIJAX</text>

    <!-- Sub-info -->
    <text x="65" y="156" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#565f89" font-weight="600">ID: #126870393</text>
    <text x="65" y="174" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#9ece6a" font-weight="700">● VERIFIED</text>
    <text x="65" y="190" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#73daca">SHELL: ZSH</text>
  </g>

  <!-- Divider Line -->
  <line x1="184" y1="106" x2="184" y2="306" stroke="#1f2b45" stroke-width="1.2" stroke-dasharray="3, 3" />

  <!-- Right Side: Structured Dynamic Bio Readout -->
  <g transform="translate(202, 106)">
    
    <!-- Row 1: Name & Handle -->
    <g transform="translate(0, 18)">
      <text x="0" y="0" class="key-label">👤 NAME</text>
      <text x="135" y="0" class="val-text">
        <tspan font-weight="700" fill="#ffffff">Elijah</tspan>
        <tspan fill="#565f89"> | </tspan>
        <tspan fill="#bb9af7" font-weight="600">@3lijax</tspan>
      </text>
    </g>

    <!-- Row 2: Location -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" class="key-label">📍 LOCATION</text>
      <text x="135" y="0" class="val-text">
        <tspan fill="#7dcfff" font-weight="600">Nairobi, Kenya</tspan>
        <tspan fill="#565f89" font-size="11.5"> [EAT / UTC+3]</tspan>
      </text>
    </g>

    <!-- Row 3: Focus -->
    <g transform="translate(0, 86)">
      <text x="0" y="0" class="key-label">🎯 FOCUS</text>
      <text x="135" y="0" class="val-text">
        <tspan fill="#e0af68" font-weight="600">Full-Stack Engineering</tspan><tspan fill="#565f89"> • </tspan>
        <tspan fill="#7aa2f7" font-weight="600">Real-Time Architecture</tspan>
      </text>
      <text x="135" y="19" class="val-text" font-size="12">
        <tspan fill="#bb9af7">Cybersecurity Tooling</tspan><tspan fill="#565f89"> &amp; </tspan><tspan fill="#9ece6a">Machine Learning</tspan>
      </text>
    </g>

    <!-- Row 4: Operating Systems -->
    <g transform="translate(0, 134)">
      <text x="0" y="0" class="key-label">💻 OS MATRIX</text>
      <text x="135" y="0" class="val-text">
        <tspan fill="#ff9e64" font-weight="600">Ubuntu</tspan>
        <tspan fill="#565f89"> ｜ </tspan>
        <tspan fill="#7dcfff" font-weight="600">Kali Linux</tspan>
        <tspan fill="#565f89"> ｜ </tspan>
        <tspan fill="#bb9af7" font-weight="600">Tails OS</tspan>
        <tspan fill="#565f89"> ｜ </tspan>
        <tspan fill="#7aa2f7" font-weight="600">Windows 11</tspan>
      </text>
    </g>

    <!-- Row 5: Current Passion -->
    <g transform="translate(0, 172)">
      <text x="0" y="0" class="key-label">🔥 PASSION</text>
      <text x="135" y="0" class="val-text">
        <tspan fill="#f7768e" font-weight="600">Deep Stacked Autoencoders</tspan>
        <tspan fill="#565f89"> &amp; </tspan>
        <tspan fill="#2ac3de" font-weight="600">High-Frequency WebSockets</tspan>
      </text>
    </g>

  </g>
</svg>
